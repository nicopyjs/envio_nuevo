name: ETL Defontana - Diario

on:
  schedule:
    # 07:07 UTC = 03:07 AM hora Chile invierno (CLT, UTC-4) | 04:07 AM en verano (CLST, UTC-3)
    # Minuto 07 (no en punto) para evitar la congestion de cron jobs de GitHub Actions en :00,
    # que puede retrasar la ejecucion real varios minutos u horas.
    - cron: "7 7 * * 1-5"  # Lunes a viernes. Cambia a "7 7 * * *" si quieres incluir fines de semana.
  workflow_dispatch:          # Permite ejecutar manualmente desde GitHub

jobs:
  etl:
    name: Extraer y subir a SharePoint
    runs-on: ubuntu-latest
    timeout-minutes: 300      # El script 3/3 puede tardar hasta ~17 min; 5 horas es margen seguro

    env:
      DEFONTANA_TOKEN:             ${{ secrets.DEFONTANA_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID:       ${{ secrets.GOOGLE_SPREADSHEET_ID }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: "Script 1/3: Encabezados últimos 3 meses"
        run: python vouchers_3m.py

      - name: "Script 2/3: Detalle últimos 3 meses"
        run: python vouchers_detail_3m.py

      - name: "Script 3/3: Detalle año completo (hist_details_YYYY)"
        run: python vouchers_detail_year.py
